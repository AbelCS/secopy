[package]
name = "secopy-app"
description = "Secopy desktop app: the Tauri shell around secopy-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
name = "secopy_app"

[[bin]]
name = "secopy"
path = "src/main.rs"

[build-dependencies]
tauri-build.workspace = true

[dependencies]
chrono.workspace = true
secopy-core.workspace = true
serde.workspace = true
specta.workspace = true
specta-typescript.workspace = true
tauri.workspace = true
tauri-plugin-dialog.workspace = true
tauri-plugin-opener.workspace = true
tauri-specta.workspace = true

# FROM's Choose… panel, where a folder or files can be picked (the dialog plugin picks one kind).
[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6.2"
objc2 = "0.6.4"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "block2", "NSApplication", "NSOpenPanel", "NSPanel", "NSResponder", "NSSavePanel", "NSWindow"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSArray", "NSString", "NSURL"] }

[dev-dependencies]
glob.workspace = true
serde_json.workspace = true
tempfile.workspace = true
