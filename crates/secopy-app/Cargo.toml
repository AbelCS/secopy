[package]
name = "secopy-app"
description = "Secopy desktop app: the Tauri shell around secopy-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[lib]
name = "secopy_app"

[[bin]]
name = "secopy"
path = "src/main.rs"

[build-dependencies]
tauri-build.workspace = true

[dependencies]
chrono.workspace = true
secopy-core.workspace = true
serde.workspace = true
serde_json.workspace = true
specta.workspace = true
specta-typescript.workspace = true
tauri = { workspace = true, features = ["tray-icon", "image-png", "macos-private-api"] }
tauri-plugin-dialog.workspace = true
tauri-plugin-opener.workspace = true
tauri-plugin-notification.workspace = true
tauri-specta.workspace = true

# FROM's Choose… panel, where a folder or files can be picked (the dialog plugin picks one kind).
block2.workspace = true
objc2.workspace = true
objc2-app-kit = { workspace = true, features = ["block2", "NSApplication", "NSOpenPanel", "NSPanel", "NSResponder", "NSSavePanel", "NSWindow"] }
objc2-foundation = { workspace = true, features = ["NSArray", "NSDictionary", "NSLocale", "NSString", "NSURL", "NSUserDefaults"] }

[dev-dependencies]
glob.workspace = true
libc.workspace = true
tempfile.workspace = true
