name: ci

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  lint:
    # Every OS, so macOS- and Windows-only `cfg` code is linted too.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
      - name: Install xxhsum (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y xxhash
      - name: Install xxhsum (macOS)
        if: runner.os == 'macOS'
        run: brew install xxhash
      - run: cargo test --workspace --locked
        env:
          # The xxhsum compatibility test must not skip where xxhsum is installed.
          SECOPY_REQUIRE_XXHSUM: ${{ runner.os != 'Windows' && '1' || '0' }}
