name: ci

# One macOS job after each merge, and on demand. PRs don't wait for CI: the checks in
# AGENTS.md run locally before every commit, and the release workflow runs the full suite
# again before building (RFD §9). Secopy is macOS only, so there are no other jobs.
# Merging the release PR is skipped here: its commits (by release-please) only change
# versions and the changelog, and the release build runs the full suite anyway.
on:
  push:
    branches:
      - main
    paths-ignore:
      - "docs/**"
      - "**/*.md"
  workflow_dispatch:

jobs:
  check:
    if: github.event_name != 'push' || github.event.head_commit.author.name != 'github-actions[bot]'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: brew install xxhash
      - run: npm ci
        working-directory: ui
      - run: npm run check
        working-directory: ui
      - run: npm test
        working-directory: ui
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
        env:
          # The xxhsum compatibility test must not skip.
          SECOPY_REQUIRE_XXHSUM: "1"
          # RAM-disk fault tests: disk full, unplugging, FAT32/exFAT.
          SECOPY_DEVICE_TESTS: "1"
