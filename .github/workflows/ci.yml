name: ci

# One macOS job after each merge, and on demand. PRs don't wait for CI: the checks in
# AGENTS.md run locally before every commit, and the release workflow runs the full suite
# again before building (RFD §9). Windows and Linux jobs return when those apps are
# supported; until then AGENTS.md's local cross-target clippy keeps the engine building.
on:
  push:
    branches:
      - main
    paths-ignore:
      - "docs/**"
      - "**/*.md"
  workflow_dispatch:

jobs:
  check:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
      - run: brew install xxhash
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
        env:
          # The xxhsum compatibility test must not skip.
          SECOPY_REQUIRE_XXHSUM: "1"
          # RAM-disk fault tests: disk full, unplugging, FAT32/exFAT.
          SECOPY_DEVICE_TESTS: "1"
