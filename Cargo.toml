[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "1.0.3"
edition = "2024"
rust-version = "1.88"
publish = false
license = "GPL-3.0-or-later"
authors = ["Abel Castro Suárez"]
repository = "https://github.com/AbelCS/secopy"

[workspace.dependencies]
secopy-core = { path = "crates/secopy-core" }
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
clap = { version = "4.6.7", features = ["derive"] }
ctrlc = "3.5.2"
libc = "0.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
glob = "0.3.4"
tempfile = "3.27.0"
specta = { version = "=2.0.0-rc.25", features = ["derive"] }
specta-typescript = "=0.0.12"
tauri = "2.12.0"
tauri-build = "2.6.3"
tauri-plugin-dialog = "2.7.3"
tauri-plugin-opener = "2.6.0"
tauri-plugin-notification = "2.4.0"
tauri-specta = { version = "=2.0.0-rc.25", features = ["derive", "typescript"] }
thiserror = "2.0.21"
walkdir = "2.5.0"
same-file = "1.0.6"
unicode-normalization = "0.1"
twox-hash = { version = "2.1.4", default-features = false, features = ["xxhash3_128", "std"] }
bs58 = "0.5.1"
quick-xml = "0.42.0"
sha2 = "0.11.0"
block2 = "0.6.2"
objc2 = "0.6.4"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std"] }
